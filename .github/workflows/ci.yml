name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck tmux jq

      - name: Lint shell scripts
        run: shellcheck -x scripts/tmux-trainer lib/*.sh lib/commands/*.sh

      - name: Validate exercises
        run: scripts/tmux-trainer lint

      - name: Run tests
        run: bats --recursive tests

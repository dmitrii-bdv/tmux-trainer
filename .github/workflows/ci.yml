name: CI

# Jobs are chained with `needs`. If `test` fails, `docs`, `release-check`,
# and `ci-gate` do not run, and `ci-gate` fails. Require `ci-gate` as the
# branch protection status check so a red test blocks merging.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck tmux jq

      - name: Lint shell scripts
        run: shellcheck -x scripts/tmux-trainer lib/*.sh lib/commands/*.sh

      - name: Validate exercises
        run: scripts/tmux-trainer lint

      - name: Run tests
        run: bats --recursive tests

  docs:
    name: docs
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lint Markdown
        run: >
          npx --yes markdownlint-cli@0.50.0 --config .markdownlint.json
          README.md CHANGELOG.md "docs/**/*.md"

  release-check:
    name: release-check
    needs: [test, docs]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Tag matches the version in the code
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(scripts/tmux-trainer --version | awk '{print $2}')"
          if [[ "${tag}" != "${version}" ]]; then
            echo "Tag v${tag} does not match TMUX_TRAINER_VERSION ${version}" >&2
            exit 1
          fi

      - name: CHANGELOG has an entry for the tag
        run: |
          grep -q "^## v${GITHUB_REF_NAME#v}\$" CHANGELOG.md || {
            echo "CHANGELOG.md has no '## ${GITHUB_REF_NAME}' section" >&2
            exit 1
          }

  ci-gate:
    name: ci-gate
    # Runs even when a dependency failed, so the gate reports the failure.
    if: always()
    needs: [test, docs, release-check]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed or be skipped
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          if echo "$results" | grep -Eq '"result": "(failure|cancelled)"'; then
            echo "At least one required job failed." >&2
            exit 1
          fi
